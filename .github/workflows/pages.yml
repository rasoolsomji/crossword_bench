name: Deploy results site

# The site is generated here from the committed live-track logs,
# annotations and pricing; docs/index.html, docs/results.json and docs/logs/
# are build outputs and are not committed. Runs on every push to main
# because the inputs are spread across logs, annotations, pricing, the
# scorer and the build script, and a missed path would leave a stale site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build leaderboard
        run: uv run --frozen scripts/build_leaderboard.py --log-dir logs/live

      - name: Bundle transcript viewer
        run: uv run --frozen inspect view bundle --log-dir logs/live --output-dir docs/logs --overwrite

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v4
