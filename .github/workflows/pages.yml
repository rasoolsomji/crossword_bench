name: Deploy results site

# docs/ holds the committed results page (built locally with
# scripts/build_leaderboard.py). The transcript viewer is bundled here
# from the public live-track logs; private logs never reach this repo.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'logs/live/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Bundle transcript viewer
        run: uv run --frozen inspect view bundle --log-dir logs/live --output-dir docs/logs --overwrite

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v4
