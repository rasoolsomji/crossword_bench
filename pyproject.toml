[project]
name = "crossword-bench"
version = "0.1.0"
description = "Benchmark for evaluating LLMs on cryptic crossword clues"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.74",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crossword_bench"]
